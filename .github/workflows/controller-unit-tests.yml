name: JavaScript SDK and web pre-merge tests

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Controller unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: jskinisi
    steps:
      - name: Check out the proposed change
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: jskinisi
          persist-credentials: false

      - name: Check out the matching public firmware
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: szolotykh/kinisi-motor-controller-firmware
          ref: aaee7e4e262e7964be6581edb45cda10788965e2
          path: kinisi-motor-controller-firmware
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify generated commands and board profiles against firmware
        run: |
          python tools/update-commands.py --schema ../kinisi-motor-controller-firmware/commands.json --check
          python tools/update-board-profiles.py --profiles ../kinisi-motor-controller-firmware/include/board_profiles.json --check

      - name: Run SDK generator tests
        run: |
          test -s tools/test_sdkgenerator.py
          test -s tools/test_board_profiles.py
          python -m unittest discover -v -s tools -p 'test_*.py'

      - name: Run SDK and web unit tests
        run: |
          test -n "$(find src/commands -name '*.test.*' -print -quit)"
          test -n "$(find src/components -name '*.test.*' -print -quit)"
          npm test -- --passWithNoTests=false
