    <path d="M 385 361 A 27 27 0 0 0 358 388" fill="none" stroke="#243746" stroke-width="1.6" />
    <polygon points="358,388 361,381 355,381" fill="#243746" />
    <circle cx="385" cy="388" r="4" fill="white" stroke="#243746" stroke-width="1.8" />
    <circle cx="385" cy="388" r="1.3" fill="#243746" stroke="none" stroke-width="1.5" />
    <text x="393" y="347" font-size="14" fill="#243746" text-anchor="start" font-weight="700">+X</text>
    <text x="316" y="393" font-size="14" fill="#243746" text-anchor="end" font-weight="700">+Y</text>
    <text x="356" y="358" font-size="13" fill="#243746" text-anchor="end" font-weight="400">+yaw</text>
  </g>
