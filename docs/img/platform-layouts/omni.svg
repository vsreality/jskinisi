    <circle cx="54" cy="365" r="23" fill="#edf2f4" stroke="#243746" stroke-width="1.7" />
    <circle cx="54" cy="365" r="3" fill="white" stroke="#243746" stroke-width="1.3" />
    <line x1="54" y1="342" x2="88" y2="342" stroke="#165988" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="54" y1="388" x2="88" y2="388" stroke="#165988" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="85" y1="342" x2="85" y2="388" stroke="#165988" stroke-width="1.65" />
    <polygon points="85,388 88,381 82,381" fill="#165988" />
    <polygon points="85,342 82,349 88,349" fill="#165988" />
    <text x="92" y="370" font-size="15" fill="#165988" text-anchor="start" font-weight="600">0.10 m</text>
    <line x1="385" y1="388" x2="385" y2="339" stroke="#243746" stroke-width="1.7" />
    <polygon points="385,339 382,346 388,346" fill="#243746" />
    <line x1="385" y1="388" x2="324" y2="388" stroke="#243746" stroke-width="1.7" />
