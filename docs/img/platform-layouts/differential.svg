<svg xmlns="http://www.w3.org/2000/svg" width="440" height="398" viewBox="0 0 440 398" role="img" aria-labelledby="title description">
  <title id="title">Differential wheel layout</title>
  <desc id="description">Top view. W0 is left and W1 is right. Both roll forward for positive wheel speed. The wheel base spans their centers. The side view measures the outer tire diameter.</desc>
  <rect x="0" y="0" width="440" height="398" rx="0" fill="white" stroke="none" stroke-width="1.6" />
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="16" y="24" font-size="16" fill="#243746" text-anchor="start" font-weight="700">Top view</text>
    <line x1="280" y1="19" x2="304" y2="19" stroke="#087451" stroke-width="2.7" />
    <polygon points="304,19 295,15 295,23" fill="#087451" />
    <text x="313" y="24" font-size="15" fill="#087451" text-anchor="start" font-weight="400">Positive roll</text>
    <rect x="106" y="68" width="228" height="142" rx="20" fill="#f6f9fa" stroke="#acbdc6" stroke-width="1.6" />
    <line x1="220" y1="70" x2="220" y2="207" stroke="#71828c" stroke-width="1" stroke-dasharray="5 4" />
    <line x1="89" y1="144" x2="351" y2="144" stroke="#71828c" stroke-width="1" stroke-dasharray="5 4" />
    <g transform="translate(109 144) rotate(0)">
      <rect x="-9" y="-37" width="18" height="74" rx="5" fill="#d9e2e6" stroke="#243746" stroke-width="2" />
      <line x1="-7" y1="0" x2="7" y2="0" stroke="#71828c" stroke-width="1.4" />
      <line x1="0" y1="-31" x2="0" y2="-52" stroke="#087451" stroke-width="2.7" />
      <polygon points="0,-52 -4,-43 4,-43" fill="#087451" />
    </g>
    <g transform="translate(331 144) rotate(0)">
      <rect x="-9" y="-37" width="18" height="74" rx="5" fill="#d9e2e6" stroke="#243746" stroke-width="2" />
      <line x1="-7" y1="0" x2="7" y2="0" stroke="#71828c" stroke-width="1.4" />
      <line x1="0" y1="-31" x2="0" y2="-52" stroke="#087451" stroke-width="2.7" />
      <polygon points="0,-52 -4,-43 4,-43" fill="#087451" />
    </g>
    <text x="128" y="138" font-size="18" fill="#243746" text-anchor="start" font-weight="700">W0</text>
    <text x="312" y="138" font-size="18" fill="#243746" text-anchor="end" font-weight="700">W1</text>
    <circle cx="220" cy="144" r="4" fill="white" stroke="#243746" stroke-width="1.8" />
    <circle cx="220" cy="144" r="1.3" fill="#243746" stroke="none" stroke-width="1.5" />
    <text x="229" y="165" font-size="14" fill="#243746" text-anchor="start" font-weight="400">O</text>
    <line x1="109" y1="148" x2="109" y2="246" stroke="#165988" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="331" y1="148" x2="331" y2="246" stroke="#165988" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="109" y1="239" x2="331" y2="239" stroke="#165988" stroke-width="1.65" />
    <polygon points="331,239 324,236 324,242" fill="#165988" />
    <polygon points="109,239 116,242 116,236" fill="#165988" />
    <text x="220" y="264" font-size="16" fill="#165988" text-anchor="middle" font-weight="600">B · Wheel base  0.30 m</text>
    <line x1="16" y1="285" x2="424" y2="285" stroke="#c9d5da" stroke-width="1" />
    <text x="16" y="309" font-size="15" fill="#243746" text-anchor="start" font-weight="700">D · Wheel diameter · side view</text>
    <text x="282" y="309" font-size="15" fill="#243746" text-anchor="start" font-weight="700">Body frame</text>
    <circle cx="54" cy="353" r="23" fill="#edf2f4" stroke="#243746" stroke-width="1.7" />
    <circle cx="54" cy="353" r="3" fill="white" stroke="#243746" stroke-width="1.3" />
    <line x1="54" y1="330" x2="88" y2="330" stroke="#165988" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="54" y1="376" x2="88" y2="376" stroke="#165988" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="85" y1="330" x2="85" y2="376" stroke="#165988" stroke-width="1.65" />
    <polygon points="85,376 88,369 82,369" fill="#165988" />
    <polygon points="85,330 82,337 88,337" fill="#165988" />
    <text x="92" y="358" font-size="15" fill="#165988" text-anchor="start" font-weight="600">0.10 m</text>
    <line x1="385" y1="376" x2="385" y2="327" stroke="#243746" stroke-width="1.7" />
    <polygon points="385,327 382,334 388,334" fill="#243746" />
    <line x1="385" y1="376" x2="324" y2="376" stroke="#243746" stroke-width="1.7" />
    <polygon points="324,376 331,379 331,373" fill="#243746" />
    <path d="M 385 349 A 27 27 0 0 0 358 376" fill="none" stroke="#243746" stroke-width="1.6" />
    <polygon points="358,376 361,369 355,369" fill="#243746" />
    <circle cx="385" cy="376" r="4" fill="white" stroke="#243746" stroke-width="1.8" />
    <circle cx="385" cy="376" r="1.3" fill="#243746" stroke="none" stroke-width="1.5" />
    <text x="393" y="335" font-size="14" fill="#243746" text-anchor="start" font-weight="700">+X</text>
    <text x="316" y="381" font-size="14" fill="#243746" text-anchor="end" font-weight="700">+Y</text>
    <text x="356" y="346" font-size="13" fill="#243746" text-anchor="end" font-weight="400">+yaw</text>
  </g>
</svg>
