  <title id="title">Custom layout concept with passive tracking wheel</title>
  <desc id="description">W0 and W1 drive at body y plus and minus 0.15 meter. W2 is a passive tracking omni wheel at x plus 0.10, y plus 0.05 meter. Its rolling direction is plus Y, ninety degrees counterclockwise from plus X. Its free direction is minus X, another ninety degrees counterclockwise from the rolling direction.</desc>
