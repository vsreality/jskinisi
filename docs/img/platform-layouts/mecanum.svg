<svg xmlns="http://www.w3.org/2000/svg" width="440" height="515" viewBox="0 0 440 515" role="img" aria-labelledby="title description">
  <title id="title">Standard (X) mecanum roller arrangement</title>
  <desc id="description">W0 front-right, W1 rear-right, W2 rear-left and W3 front-left. Width and length are full center-to-center spans. Each tire rolls forward for positive wheel rotation. Front is at the top. Orange lines mark the visible roller axles on top of each tire. The front-right rollers slope forward and right.</desc>
