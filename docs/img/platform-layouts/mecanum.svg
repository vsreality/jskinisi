    <line x1="133" y1="55" x2="283" y2="55" stroke="#165988" stroke-width="1.65" />
    <polygon points="283,55 276,52 276,58" fill="#165988" />
    <polygon points="133,55 140,58 140,52" fill="#165988" />
    <text x="208" y="47" font-size="15" fill="#165988" text-anchor="middle" font-weight="600">W · Width  0.30 m</text>
    <line x1="283" y1="101" x2="368" y2="101" stroke="#165988" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="283" y1="301" x2="368" y2="301" stroke="#165988" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="357" y1="101" x2="357" y2="301" stroke="#165988" stroke-width="1.65" />
